# Clawputer terminal mode (own tmux socket, doesn't touch your ~/.tmux.conf)
set -g history-limit 5000
set -g status off
set -g escape-time 10
setw -g mode-keys vi
set -g prefix2 C-a
# the Cardputer launcher terminal may not pass ctrl+b, so PageUp enters scroll mode directly
bind -n PPage copy-mode -u
bind -n F1 copy-mode
bind -T copy-mode-vi PPage send -X page-up
bind -T copy-mode-vi NPage send -X page-down
bind -T copy-mode-vi Escape send -X cancel
# holding esc in the launcher kills the tmux client -> end the session so things get restored
set-hook -g client-detached "kill-session -t clawputer"
